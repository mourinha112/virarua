# /etc/nginx/sites-available/seumundonovo  (troque SEU_DOMINIO pelo seu domínio)
# Front (arquivos do build) e API no MESMO domínio: os cookies de login e o CSRF funcionam sem ajuste.
server {
  listen 80;
  server_name SEU_DOMINIO www.SEU_DOMINIO;

  root /srv/seumundonovo/app/dist;
  index index.html;
  client_max_body_size 2m;

  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml;
  gzip_min_length 1024;

  # API + webhook do Instagram -> Node na porta 8787 (só acessível por dentro do servidor)
  location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # arquivos com hash no nome: cache longo
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

  location / { try_files $uri $uri/ /index.html; }
}
